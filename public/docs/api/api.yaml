openapi: 3.0.0
info:
  title: DEELS API
  version: 0.3.0
  description: 'Подозрительные аккаунты получают HTTP 403 на ограниченные действия. Формат ответа описан схемой SuspiciousRestrictionResponse.'
servers:
  - url: localhost
  - url: https://deels.ru
paths:
  /api/user/sendEmailCode:
    post:
      tags:
        - Auth
      summary: 'Отправить код подтверждения email при регистрации'
      description: 'Проверяет формат, российский домен, уникальность и отсутствие email в списке одноразовых адресов. При успешной проверке отправляет шестизначный код.'
      operationId: sendRegistrationEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@yandex.ru
      responses:
        200:
          description: 'Код отправлен'
          content:
            application/json:
              example:
                success: true
        422:
          description: 'Email не прошел валидацию или находится в черном списке'
          content:
            application/json:
              example:
                success: false
                error: Данный e-mail заблокирован. Используйте другой адрес для регистрации
        429:
          description: 'Повторная отправка временно недоступна'
          content:
            application/json:
              example:
                success: false
                error: Повторная отправка будет доступна через 87 сек.
                retry_after: 87
  /api/register:
    post:
      tags:
        - Auth
      summary: 'Регистрация'
      description: ''
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - password_confirmation
              properties:
                email:
                  description: 'Email с российским доменом. Одноразовые и временные почтовые адреса не принимаются.'
                  type: string
                  format: email
                  example: user@yandex.ru
                username:
                  description: ''
                  type: string
                  example: string
                password:
                  description: Пароль
                  type: string
                  example: string
                password_confirmation:
                  description: Подтверждение пароля
                  type: string
                  example: string
                phone:
                  description: Необязательный номер телефона в российском формате
                  type: string
                  nullable: true
                  example: '+79999999999'
      responses:
        200:
          description: 'Успешная регистрация либо ошибка валидации. Для заблокированного email в errors.email возвращается сообщение «Данный e-mail заблокирован. Используйте другой адрес для регистрации».'
          content:
            application/json:
              examples:
                success:
                  value:
                    success: true
                    user_id: 123
                    access_token: 266|uDzT9mEeJKNDp45k7krKP3l37JRfCzHztb7vhxXLec706d47
                    token_type: Bearer
                disposableEmail:
                  value:
                    success: false
                    errors:
                      email:
                        - Данный e-mail заблокирован. Используйте другой адрес для регистрации
  /api/auth_token:
    post:
      tags:
        - Auth
      summary: 'Авторизация'
      description: ''
      operationId: authtoken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: ''
                  type: string
                  example: string
                password:
                  description: ''
                  type: string
                  example: string
                device_name:
                  description: Устройство
                  type: string
                  example: string
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                access_token: 4|JEh7jfpwMvWS3vms79JIzKXOg6Ru0p2NNG23hi7u9c814cd9
                token_type: Bearer
  /api/firebase_token:
    post:
      tags:
        - Auth
      summary: 'Firebase токен'
      description: ''
      operationId: firebasetoken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  description: ''
                  type: string
                  example: string
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                access_token: 4|JEh7jfpwMvWS3vms79JIzKXOg6Ru0p2NNG23hi7u9c814cd9
                token_type: Bearer
  /api/vk_auth/link:
    get:
      tags:
        - Auth
      summary: 'Получить ссылку авторизации VK ID'
      description: 'Генерирует VK ID authorize URL без хранения client_id в клиентском приложении. code_verifier нужно сохранить на клиенте и передать в /api/vk_auth вместе с code и device_id.'
      operationId: vk_auth_link
      parameters:
        - in: query
          name: redirect_uri
          required: false
          schema:
            type: string
            example: https://oauth.vk.com/blank.html
        - in: query
          name: scope
          required: false
          schema:
            type: string
            example: vkid.personal_info email phone friends
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                auth_url: https://id.vk.com/authorize?client_id=54653069&redirect_uri=https%3A%2F%2Foauth.vk.com%2Fblank.html&response_type=code&scope=vkid.personal_info%20email%20phone%20friends&state=random&code_challenge=challenge&code_challenge_method=S256
                state: random
                code_verifier: verifier
                redirect_uri: https://oauth.vk.com/blank.html
                scope: vkid.personal_info email phone friends
  /api/vk_auth:
    post:
      tags:
        - Auth
      summary: 'Авторизация через VK'
      description: 'Принимает access_token VK ID в vk_token или параметры VK ID authorization code flow: code, device_id, code_verifier. Для обратной совместимости также поддерживается старый VK access token. Если VK token содержит право friends, backend сам вызовет VK API friends.get, сохранит друзей и вернет найденных пользователей Deels в found_users.'
      operationId: vk_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vk_token:
                  description: 'Access token, полученный после авторизации VK ID'
                  type: string
                  example: vk1.a.0vomm8wqT3kFxiiXo...
                code:
                  description: 'Authorization code из callback VK ID'
                  type: string
                  example: vk2.a.abcd...
                device_id:
                  description: 'device_id из callback VK ID'
                  type: string
                  example: abcdef12-3456-7890-abcd-ef1234567890
                code_verifier:
                  description: 'PKCE code_verifier, использованный при формировании code_challenge'
                  type: string
                  example: 2cf24dba5fb0a30e26e83b2ac5b9e29e...
                redirect_uri:
                  description: 'Redirect URI, использованный при авторизации. Если не передан, используется VKONTAKTE_REDIRECT_URI.'
                  type: string
                  example: https://deels.ru/login/vk-callback

      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                access_token: 4|JEh7jfpwMvWS3vms79JIzKXOg6Ru0p2NNG23hi7u9c814cd9
                token_type: Bearer
                found_users:
                  - id: 76795
                    username: vk_1070650695
                    avatar: https://deels.ru/default_avatars/avatar_1.png
                    source: vk
                show_friends_popup: true
                email_required: true
                email_verification_required: false
                show_email_prompt: true
                next_email_prompt_at: '2026-07-17T13:35:32+03:00'
  /api/user/email:
    post:
      tags:
        - Users
      summary: 'Сохранить email и получить код подтверждения'
      description: 'Требуется Bearer token. Сохраняет email авторизованного пользователя как неподтвержденный и отправляет шестизначный код тем же механизмом, который используется при регистрации. Этот же endpoint используется для повторной отправки. Повторный запрос доступен через 120 секунд.'
      operationId: saveEmailAndSendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@yandex.ru
      responses:
        200:
          description: 'Email сохранен, код отправлен'
          content:
            application/json:
              example:
                success: true
                email: user@yandex.ru
                email_required: false
                email_verification_required: true
                retry_after: 120
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.
        422:
          description: 'Некорректный, иностранный, одноразовый или уже занятый email'
          content:
            application/json:
              examples:
                invalidEmail:
                  value:
                    success: false
                    error: Поле email имеет неверный формат.
                disposableEmail:
                  value:
                    success: false
                    error: Данный e-mail заблокирован. Используйте другой адрес для регистрации
        429:
          description: 'Повторная отправка временно недоступна'
          content:
            application/json:
              example:
                success: false
                error: Повторная отправка будет доступна через 87 сек.
                retry_after: 87
  /api/user/email/verify:
    post:
      tags:
        - Users
      summary: 'Подтвердить email кодом'
      description: 'Требуется Bearer token. Проверяет шестизначный код для сохраненного email. После успеха email помечается подтвержденным в users_activation.'
      operationId: verifyEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
      responses:
        200:
          description: 'Email подтвержден'
          content:
            application/json:
              example:
                success: true
                email: user@yandex.ru
                email_required: false
                email_verification_required: false
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.
        422:
          description: 'Код некорректен или просрочен'
          content:
            application/json:
              example:
                success: false
                error: Неверный или просроченный код.
  /api/user/email-prompt/postpone:
    post:
      tags:
        - Users
      summary: 'Отложить напоминание об email'
      description: 'Требуется Bearer token. Вызывается при выборе «Позже». Следующие показы назначаются на третий день после регистрации, через неделю после регистрации, затем раз в месяц.'
      operationId: postponeEmailPrompt
      responses:
        200:
          description: 'Напоминание отложено'
          content:
            application/json:
              example:
                success: true
                next_email_prompt_at: '2026-07-19T13:35:32+03:00'
                show_email_prompt: false
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.
  /api/apple_auth:
    post:
      tags:
        - Auth
      summary: 'Авторизация через Apple ID'
      description: ''
      operationId: apple_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apple_token:
                  description: ''
                  type: string
                  example: eyJraWQiOiJyczBNM2tPV...
  /api/yandex_auth:
    post:
      tags:
        - Auth
      summary: 'Авторизация через Yandex'
      description: ''
      operationId: yandex_auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yandex_token:
                  description: ''
                  type: string
                  example: y0__xCP57Y...
  /api/user/{id}:
    get:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            example: 12
      summary: Профиль пользователя
      description: 'Без указания id отображается информация авторизованного пользователя<br><br>
      <b>wallet_balance:</b> баланс в дилсах, доступный пользователю для использования внутри проекта<br>
      <b>profit_balance:</b> баланс средств в рублях, полученных пользователем внутри проекта. доступны только для вывода.<br>
      <b>withdraw_balance:</b> баланс средств в рублях, которые пользователь может вывести с проекта (сумма дилсов и средств)<br><br>
      <b>trust_rating:</b> рейтинг доверия пользователя, может быть положительным или отрицательным, по умолчанию 0<br><br>
      <b>contests:</b> видимые авторизованному пользователю челленджи и батлы, в которых владелец профиля является автором или участником.
      Поле <b>profile_contest_type</b> содержит тип элемента: challenge или battle.<br>
      <b>hidden_contests_count:</b> количество челленджей и батлов владельца профиля, скрытых от авторизованного пользователя настройками видимости.<br><br>
      кошельки пользователя:<br>
      <b>default:</b> для всех входящих операций. то, что пользователь получает внутри проекта (он же profit_balance)<br>
      <b>payments:</b> кошелек, который пополняет пользователь и использует для оплат\донатов (он же wallet_balance)<br>
      '
      operationId: user_info
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                data:
                  id: 12
                  name: Name
                  username: Username
                  email: email@mail.ru
                  status: text
                  trust_rating: 0
                  limits: json or null
                  country: Российская Федерация
                  gender: Мужской
                  address: null
                  website: null
                  phone: null
                  avatar: https://project.loc/uploads/images/avatars/12/file.jpg
                  avatar_url: https://project.loc/uploads/images/avatars/12/file.jpg
                  donated: '100500.00'
                  campaigns_total: 14
                  last_campaigns: []
                  challenges: []
                  challenges_participant: []
                  contests:
                    - id: 123
                      title: Мой челлендж
                      profile_contest_type: challenge
                    - id: 456
                      title: Мой батл
                      profile_contest_type: battle
                  hidden_contests_count: 2
                  wallet_balance: 100500
                  profit_balance: 100500
                  withdraw_balance: 100500
                  wallets: []
                  is_activated: 1
                  blocked_by_user: 1
                  need_actions: {}
                  suspicious_blocked_until: '2026-07-17T13:00:00+03:00'
                  suspicious_retry_after: 3600
                  stories: []
                  likes_count: 0
  /api/profile/likes:
    get:
      tags:
        - Users
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            example: 'stories'
          description: 'stories - сторис, campaigns - копилки, comments - комментарии'
      summary: Просмотр лайков
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                comments: []
                campaigns: []
                stories: []
  /api/user/abuse:
    get:
      tags:
        - Users
      summary: 'Получить жалобу на пользователя'
      description: ''
      operationId: get_abuse
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
            example: 12
          description: ID пользователя, на которого подана жалоба
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                user_id: 12
                abused_by: 34
                blocked: 1
                abuse: spam
    post:
      tags:
        - Users
      summary: 'Жалоба на пользователя'
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  description: ''
                  type: integer
                  example: integer
                blocked:
                  description: 'Скрыть контент сторис'
                  type: integer
                  example: 1
                abuse:
                  description: ''
                  type: string
                  example: string
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                message: Ваша жалоба получена!
        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                error: Вы уже пожаловались на этого пользователя
  /api/user/follow:
    post:
      tags:
        - Users
      summary: 'Подписка пользователя'
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  description: 'Кто подписывается'
                  type: integer
                  example: integer
                follow_id:
                  description: 'На кого подписывается'
                  type: integer
                  example: integer
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                message: Вы подписались!
                count: 1
        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                error: Вы не можете подписаться на себя
  /api/user_friends:
    get:
      tags:
        - Users
      summary: 'Список друзей'
      description: 'Список пользователей, на которых подписан текущий пользователь и которые подписаны на него'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                followers:
                  - id: 67124
                    username: username1
                    avatar: https://deels.ru/uploads/images/avatars/67124/833c761f-29ce-4c16-ae11-ab66b4d11625.jpg
                  - id: 6
                    username: username2
                    avatar: https://deels.ru/uploads/images/profile-photo-female.png

        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                error: Вы не авторизованы
  /api/user_followers:
    get:
      tags:
        - Users
      summary: 'Список подписок'
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                followers:
                  - id: 67124
                    username: username1
                    avatar: https://deels.ru/uploads/images/avatars/67124/833c761f-29ce-4c16-ae11-ab66b4d11625.jpg
                  - id: 6
                    username: username2
                    avatar: https://deels.ru/uploads/images/profile-photo-female.png

        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                error: Вы не авторизованы
  /api/user_followings:
    get:
      tags:
        - Users
      summary: 'Список подписчиков'
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                followers:
                  - id: 67124
                    username: username1
                    avatar: https://deels.ru/uploads/images/avatars/67124/833c761f-29ce-4c16-ae11-ab66b4d11625.jpg
                  - id: 6
                    username: username2
                    avatar: https://deels.ru/uploads/images/profile-photo-female.png

        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                error: Вы не авторизованы
  /api/user/activation_resend:
    post:
      tags:
        - Users
      summary: 'Отправка повторного запроса на получение звонка'
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  description: ''
                  type: integer
                  example: integer
                type:
                  description: 'sms | phone'
                  type: string
                  example: 'phone'
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                action: phone
                time: 2024/04/12 00:09:15
                message: На номер 7999***9999 совершен звонок в 12.04.24 00:07:15. Пожалуйста, введите последние 4 цифры номера телефона входящего звонка в соответствующее поле
                phone: '89999999999'

        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                error: Пользователь не найден
        401:
          description: ''
          content:
            application/json:
              example:
                success: false
                verified: 0
                message: Повторный запрос активацию телефона можно отправить через 1 мин 48 сек!
  /api/user/activation_verify:
    post:
      tags:
        - Users
      summary: 'Верификация кода'
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  description: ''
                  type: integer
                  example: integer
                phone_code:
                  description: ''
                  type: integer
                  example: integer
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                error: Пользователь не найден
        401:
          description: ''
          content:
            application/json:
              example:
                success: false
                error: Подтверждение не выполнено!
  /api/user/phone_update:
    post:
      tags:
        - Users
      summary: 'Обновление номера телефона'
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  description: ''
                  type: integer
                  example: integer
                phone:
                  description: ''
                  type: integer
                  example: '89999999999'
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
