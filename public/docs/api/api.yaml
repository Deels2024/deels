                        enum:
                          - pending
                          - allowed
                          - denied
                        description: 'Статус запроса контактов: pending — пользователь еще не выбирал действие; allowed — пользователь разрешил доступ и контакты были импортированы; denied — пользователь нажал "Позже".'
                        example: pending
                      source:
                        type: string
                        nullable: true
                        enum:
                          - phonebook
                          - vk
                          - mixed
                        description: 'Источник полученных контактов: phonebook — телефонная книга; vk — друзья Вконтакте; mixed — использованы оба источника; null — контакты еще не импортировались.'
                        example: null
                      first_confirmed_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 'Дата и время первого подтвержденного доступа к контактам. null, если пользователь еще не нажимал "Разрешить".'
                        example: null
                      last_denied_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 'Дата и время последнего нажатия "Позже". null, если пользователь еще не откладывал запрос.'
                        example: null
                      next_prompt_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 'Дата и время, после которого клиенту можно снова показать окно запроса контактов. Заполняется после нажатия "Позже" как текущее время + 12 часов. null, если повторный показ не ограничен.'
                        example: null
                      can_prompt_now:
                        type: boolean
                        description: 'true, если серверное ограничение по next_prompt_at не мешает показу окна. Клиент дополнительно должен проверить, что пользователь провел в приложении 5 минут.'
                        example: true
              example:
                success: true
                data:
                  status: pending
                  source: null
                  first_confirmed_at: null
                  last_denied_at: null
                  next_prompt_at: null
                  can_prompt_now: true
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.

  /api/contacts/deny:
    post:
      tags:
        - Contact Discovery
      summary: 'Пользователь нажал "Позже" в запросе контактов'
      description: 'Требуется Bearer token. Сервер сохраняет отказ и время следующего возможного показа через 12 часов. Клиент снова показывает окно, когда next_prompt_at наступил и пользователь провел в приложении 5 минут.'
      operationId: contactsDeny
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                data:
                  next_prompt_at: '2026-06-24T09:00:00.000000Z'
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.

  /api/contacts/import:
    post:
      tags:
        - Contact Discovery
      summary: 'Импорт хешей телефонов из контактной книги'
      description: 'Требуется Bearer token. Клиент нормализует телефоны в единый формат, считает SHA-256 и отправляет только 64-символьные hex-хеши. Сырые телефоны на сервер не отправляются. Правила нормализации: удалить все символы кроме цифр; если 10 цифр и номер начинается с 9, добавить код РФ 7; если 11 цифр и номер начинается с 8, заменить 8 на 7; принимать только номера 11-15 цифр, не начинающиеся с 0; SHA-256 считать от строки с плюсом, например +79991234567.'
      operationId: contactsImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_hashes
              properties:
                phone_hashes:
                  description: 'Массив SHA-256 хешей телефонов'
                  type: array
                  maxItems: 5000
                  items:
                    type: string
                    minLength: 64
                    maxLength: 64
                    example: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                found_users:
                  - id: 123
                    username: username1
                    avatar: https://deels.ru/default_avatars/avatar_1.png
                    source: phone
                show_friends_popup: true
        422:
          description: 'Ошибка валидации'
          content:
            application/json:
              example:
                message: The given data was invalid.
                errors:
                  phone_hashes.0:
                    - The phone_hashes.0 format is invalid.
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.

  /api/contacts/suggestions:
    get:
      tags:
        - Contact Discovery
      summary: 'Найденные друзья в Deels'
      description: 'Требуется Bearer token. Возвращает найденных пользователей, на которых текущий пользователь еще не подписался через окно предложения друзей.'
      operationId: contactsSuggestions
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                found_users:
                  - id: 123
                    username: username1
                    avatar: https://deels.ru/default_avatars/avatar_1.png
                    source: phone
                  - id: 456
                    username: username2
                    avatar: https://deels.ru/default_avatars/avatar_2.png
                    source: vk
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.

  /api/contacts/suggestions/follow:
    post:
      tags:
        - Contact Discovery
      summary: 'Подписаться на найденных друзей'
      description: 'Требуется Bearer token. Используется при нажатии "Да" в окне "Ваши друзья уже на Deels". Подписывает текущего пользователя только на тех пользователей, которые были найдены через импорт контактов или VK-друзей.'
      operationId: contactsSuggestionsFollow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
              properties:
                user_ids:
                  description: 'ID найденных пользователей'
                  type: array
                  maxItems: 500
                  items:
                    type: integer
                    example: 123
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                followed_user_ids:
                  - 123
                  - 456
        422:
          description: 'Ошибка валидации'
          content:
            application/json:
              example:
                message: The given data was invalid.
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.

  /api/vk/friends/import:
    post:
      tags:
        - Contact Discovery
      summary: 'Импорт ID друзей Вконтакте'
      description: 'Требуется Bearer token. Используется после VK-регистрации/авторизации, если клиент запросил право доступа к списку друзей. Сервер сохраняет VK ID друзей и ищет среди них пользователей Deels по users.vk_id.'
      operationId: vkFriendsImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vk_friend_ids
              properties:
                vk_friend_ids:
                  description: 'Массив VK ID друзей пользователя'
                  type: array
                  maxItems: 10000
                  items:
                    type: string
                    example: '123456789'
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                found_users:
                  - id: 456
                    username: username2
                    avatar: https://deels.ru/default_avatars/avatar_2.png
                    source: vk
                show_friends_popup: true
        422:
          description: 'Ошибка валидации'
          content:
            application/json:
              example:
                message: The given data was invalid.
        401:
          description: 'Пользователь не авторизован'
          content:
            application/json:
              example:
                message: Unauthenticated.

  /api/challenges/select_winners:
    post:
      tags: [Challenges]
      summary: Ручной выбор победителей челленджа
      description: Доступно автору в течение трех дней после завершения, когда winner_selection=creator и winner_selection_status=pending.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, winner_user_ids]
              properties:
                challenge_id:
                  type: integer
                winner_user_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
      responses:
        200:
          description: Победители сохранены
          content:
            application/json:
              example: {success: true, winner_user_ids: [12, 34]}
        422:
          description: Выбор недоступен, просрочен или содержит недопустимых пользователей

  /api/challenges/delete:
    post:
      tags: [Challenges]
      summary: Удалить челлендж
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id]
              properties:
                challenge_id: {type: integer}
      responses:
        200:
          description: Результат удаления
          content:
            application/json:
              example: {success: true, message: Челлендж удален}

  /api/battles/delete:
    post:
      tags: [Battles]
      summary: Удалить батл
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [battle_id]
              properties:
                battle_id: {type: integer}
      responses:
        200:
          description: Результат удаления

  /api/challenges/preview/{id}:
    get:
      tags: [Challenges]
      summary: HTML-превью челленджа для модального окна
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: user_id, in: query, required: false, schema: {type: integer}}
      responses:
        200:
          description: HTML находится в поле data

  /api/battles/preview/{id}:
    get:
      tags: [Battles]
      summary: HTML-превью батла для модального окна
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: user_id, in: query, required: false, schema: {type: integer}}
      responses:
        200:
          description: HTML находится в data, данные батла находятся в battle

  /api/challenges/get_video/{id}:
    get:
      tags: [Challenges]
      summary: Поток основного медиа вводного сторис или обложки челленджа
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        200: {description: Медиафайл с поддержкой Range-запросов}
        404: {description: Челлендж или медиа недоступны}

  /api/battles/get_video/{id}:
    get:
      tags: [Battles]
      summary: Поток основного медиа вводного сторис или обложки батла
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        200: {description: Медиафайл с поддержкой Range-запросов}
        404: {description: Батл или медиа недоступны}

  /api/contests/{type}/{id}/join:
    post:
      tags: [Challenges, Battles]
      summary: Принять участие
      security:
        - bearerAuth: []
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [challenge, battle]}}
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        200:
          description: Пользователь стал участником без перехода к загрузке сторис
          content:
            application/json:
              example: {success: true, status: active, message: Вы участвуете}

  /api/contests/{type}/{id}/leave:
    post:
      tags: [Challenges, Battles]
      summary: Выйти из участия
      security:
        - bearerAuth: []
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [challenge, battle]}}
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        200:
          description: Участие прекращено
          content:
            application/json:
              example: {success: true, status: left, message: Участие прекращено}

  /api/contests/{type}/{id}/rejoin:
    post:
      tags: [Challenges, Battles]
      summary: Возобновить участие
      security:
        - bearerAuth: []
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [challenge, battle]}}
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        200:
          description: Участие возобновлено

  /api/battles/{id}/accept:
    post:
      tags: [Battles]
      summary: Принять вызов в батл
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        200:
          description: Пользователь добавлен в участники
          content:
            application/json:
              example: {success: true, status: active, message: Вызов принят}

  /api/battles/{id}/decline:
    post:
      tags: [Battles]
      summary: Отклонить вызов в батл
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        200:
          description: Вызов отклонен, автор получает уведомление
          content:
            application/json:
              example: {success: true, status: declined, message: Вызов отклонен}

  /api/contests/{type}/{id}/invites/users:
    get:
      tags: [Challenges, Battles]
      summary: Пользователи для приглашения или вызова
      security:
        - bearerAuth: []
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [challenge, battle]}}
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: search, in: query, required: false, schema: {type: string}}
      responses:
        200: {description: Списки друзей, случайных пользователей и результаты поиска}

  /api/contests/invites/users:
    get:
      tags: [Challenges, Battles]
      summary: Пользователи для приглашения до создания челленджа или батла
      security:
        - bearerAuth: []
      parameters:
        - {name: search, in: query, required: false, schema: {type: string}}
        - {name: friends_only, in: query, required: false, schema: {type: boolean}}
        - {name: exclude_ids, in: query, required: false, schema: {type: string}, description: ID через запятую}
      responses:
        200: {description: Списки друзей, случайных пользователей и результаты поиска}

  /api/contests/{type}/{id}/invites:
    post:
      tags: [Challenges, Battles]
      summary: Добавить приглашенных пользователей
      description: При редактировании существующие приглашения не удаляются.
      security:
        - bearerAuth: []
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [challenge, battle]}}
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: {type: integer}
      responses:
        200:
          description: Новые приглашения
          content:
            application/json:
              example: {success: true, invited_ids: [123, 456]}

  /api/contests/{type}/{id}/reports:
    post:
      tags: [Challenges, Battles]
      summary: Отправить чек-ин без сторис
      security:
        - bearerAuth: []
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [challenge, battle]}}
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: number
                  description: Обязательно для checkin=value
      responses:
        200: {description: Созданный или обновленный отчет и суммарное значение}

  /api/stories/exclude-useful:
    post:
      tags: [Stories, Challenges, Battles]
      summary: Исключить сторис из блока Полезное
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [story_id]
              properties:
                story_id: {type: integer}
      responses:
        200:
          description: Сторис остается в профиле, но отвязывается от челленджа или батла
          content:
            application/json:
              example: {success: true}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  responses:
    SuspiciousRestriction:
      description: 'Действие ограничено для подозрительного аккаунта'
      headers:
        Retry-After:
          description: 'Оставшееся время блокировки в секундах'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuspiciousRestrictionResponse'
  schemas:
    SuspiciousRestrictionResponse:
      type: object
      required:
        - success
        - error
        - message
        - need_actions
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: 'Ваша активность слишком великая, наш сервер перегрелся и ему нужно отдохнуть. Все возможности восстановятся через 1 ч.'
        message:
          type: string
          example: 'Ваша активность слишком великая, наш сервер перегрелся и ему нужно отдохнуть. Все возможности восстановятся через 1 ч.'
        need_actions:
          type: object
          additionalProperties:
            type: string
          example: {}
        shouldShowEmailPrompt:
          type: boolean
          example: false
        shouldShowPhonePrompt:
          type: boolean
          example: false
        suspicious_blocked_until:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-17T13:00:00+03:00'
        suspicious_retry_after:
          type: integer
          nullable: true
          description: 'Оставшееся время блокировки в секундах'
          example: 3600
        retry_after:
          type: integer
          nullable: true
          description: 'Совместимое поле оставшегося времени в секундах'
          example: 3600

tags:
  - name: Auth
    description: Регистрация, авторизация
  - name: Campaigns
    description: ''
  - name: Stories
    description: ''
  - name: Challenges
    description: ''
  - name: Battles
    description: ''
  - name: Users
    description: ''
  - name: Messages
    description: ''
  - name: Wallet
    description: ''
  - name: Content
    description: ''
  - name: Games
    description: ''
  - name: Contact Discovery
    description: Запрос контактов, импорт хешей телефонов и друзей Вконтакте

  - name: AI
    description: Веб-сервис по взаимодействию с chatgpt
