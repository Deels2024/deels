  /api/battles/store:
    post:
      tags:
        - Battles
      summary: 'Создание батла'
      description: |-
        Создает батл. Запрос должен отправляться как multipart/form-data.
        Обложка mainImg обязательна. Вводное сторис intro_story необязательно.
        Если intro_story передан, он создается как main_story.
        Если intro_story является видео, видео обрезается до 5 секунд и для него генерируется video_preview.
        called_user_id обязателен: это пользователь, которому отправлен вызов. Автор батла автоматически добавляется вторым участником.
        Челлендж-коин временно отключен: amount необязателен и сохраняется как 0.
        Для редактирования передайте battle_id. Автор остается активным участником батла.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - min_participants
                - days
                - criteria[]
                - mainImg
                - called_user_id
              properties:
                title:
                  description: 'Название батла'
                  type: string
                  example: Название
                description:
                  description: 'Описание батла'
                  type: string
                  example: Описание
                amount:
                  description: 'Челлендж-коин временно отключен. Значение необязательно и сохраняется как 0.'
                  type: integer
                  minimum: 0
                  maximum: 10000
                  example: 0
                min_participants:
                  description: 'Минимальное количество участников для старта. Для батла используется значение 2.'
                  type: integer
                  minimum: 0
                  maximum: 100
                  example: 2
                cost:
                  description: 'Стоимость участия'
                  type: integer
                  example: 0
                days:
                  description: 'Продолжительность в днях'
                  type: integer
                  minimum: 1
                  example: 1
                criteria[]:
                  description: 'Критерии победителя. Минимум один элемент: by_views, by_comments, by_likes.'
                  type: string
                  example: by_likes
                mainImg:
                  description: 'Обязательная обложка батла: изображение или видео до 5 секунд.'
                  type: string
                  format: binary
                intro_story:
                  description: 'Необязательное вводное сторис: изображение или видео. Если передано, используется как main_story и как fallback для обложки/preview.'
                  type: string
                  format: binary
                called_user_id:
                  description: 'ID пользователя в блоке Вызов. Не может совпадать с автором.'
                  type: integer
                  example: 123
                date_from_visual:
                  description: 'Дата и время начала в формате ДД.ММ.ГГ ЧЧ:ММ. Необязательно, по умолчанию текущее время.'
                  type: string
                  example: '12.07.26 15:30'
                date_to_visual:
                  description: 'Дата и время окончания в формате ДД.ММ.ГГ ЧЧ:ММ. Необязательно.'
                  type: string
                  example: '19.07.26 15:30'
                participants_visual:
                  description: 'Для батла используется 2 участника.'
                  type: string
                  enum: ['2']
                  example: '2'
                visibility:
                  description: 'Видимость батла.'
                  type: string
                  example: all
                rhythm_visual:
                  description: 'Ритм батла.'
                  type: string
                  enum: [once, daily, three_days]
                  example: daily
                checkin_visual:
                  description: 'Тип чек-ина.'
                  type: string
                  example: story
                reward_amount:
                  description: 'Награда в дилсах. Необязательно, только положительное значение, не больше баланса автора.'
                  type: integer
                  minimum: 1
                  example: 500
                invite_user_ids[]:
                  description: 'ID приглашенных пользователей к просмотру.'
                  type: integer
                  example: 123
                winner_selection:
                  description: 'Для батла используется автоматический выбор по лайкам.'
                  type: string
                  enum: [likes]
                  example: likes
                battle_id:
                  description: 'ID редактируемого батла. Если отсутствует, создается новый батл.'
                  type: integer
                  example: 5
      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                battle_id: 5
                clear_challenge_create_draft: true
        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                errors:
                  mainImg:
                    - Добавьте обложку
                  called_user_id:
                    - Поле called user id обязательно для заполнения.
