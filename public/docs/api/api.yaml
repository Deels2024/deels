  /api/stories/upload:
    post:
      tags:
        - Stories
      summary: Загрузить медиа для сторис
      description: |-
        Загружает файл и возвращает данные созданного media.
        Поддерживаемые изображения: JPEG, JPG, PNG, HEIF, HEIC.
        Поддерживаемые видео: MP4, MOV, AVI, MPEG.
        Изображения на сервере конвертируются в две копии: JPEG fallback и WebP для современных устройств. Оригинал изображения не хранится.
        Максимальный размер изображения: 10 Мб. Максимальный размер видео задается параметром STORY_MAX_UPLOAD_MB, по умолчанию 100 Мб.
        Максимальная длительность видео для сторис: 60 секунд.
        RAW/DNG/CR2/NEF и другие RAW-форматы не поддерживаются.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  description: 'Медиафайл сторис. Допустимые изображения: JPEG, JPG, PNG, HEIF, HEIC. Допустимые видео: MP4, MOV, AVI, MPEG.'
                  type: string
                  format: binary

      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                type: image
                file_size: 5242880
                path: https://deels.ru/uploads/stories/2026/06/22/fc1d0a32b4b5a8f6.jpg
                webp_path: https://deels.ru/uploads/stories/2026/06/22/fc1d0a32b4b5a8f6.webp
        400:
          description: ''
          content:
            application/json:
              examples:
                empty:
                  summary: Файл не передан
                  value:
                    success: false
                    error: Отсутствует контент
                unsupported_image_format:
                  summary: Неподдерживаемый формат изображения
                  value:
                    success: false
                    error: Этот формат не поддерживается. Пожалуйста, загрузите фото в формате JPEG, JPG, PNG, HEIF или HEIC
                file_too_large:
                  summary: Превышен максимальный вес изображения
                  value:
                    success: false
                    error: Вес файла превышает 10 Мб.
                video_too_long:
                  summary: Видео длиннее 60 секунд
                  value:
                    success: false
                    error: Длительность видео превышает 60 сек. Пожалуйста, загрузите более короткое видео для сторис
  /api/stories/store:
    post:
      tags:
        - Stories
      summary: Создать сторис
      description: |-
        Создает сторис из уже загруженного media_id или из переданного файла.
        Для создания сторис копилки передайте campaign_id. Копилка должна принадлежать авторизованному пользователю.
        Успешная сторис копилки увеличивает здоровье всех копилок пользователя на 3. Если вместе со сторис передан challenge_id, здоровье увеличивается на 5.
        В поле file можно передать видео или изображение. Поддерживаемые изображения: JPEG, JPG, PNG, HEIF, HEIC.
        Изображения сохраняются не как оригинал, а как две серверные копии: JPEG fallback и WebP.
        Максимальный размер изображения: 10 Мб. Максимальный размер видео задается параметром STORY_MAX_UPLOAD_MB, по умолчанию 100 Мб.
        Максимальная длительность видео: 60 секунд.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: 'Медиафайл сторис. Если передан media_id, file можно не передавать.'
                  type: string
                  format: binary
                media_id:
                  description: 'ID ранее загруженного media'
                  type: integer
                  example: 75
                description:
                  description: ''
                  type: string
                  example: string
                amount:
                  description: 'Стоимость сторис в дилсов'
                  type: integer
                  example: 100
                campaign_id:
                  description: 'ID копилки. Передайте для создания сторис копилки. Копилка должна принадлежать авторизованному пользователю.'
                  type: integer
                  example: 46231
                challenge_id:
                  description: 'ID челленджа'
                  type: string
                  example: 5
                battle_id:
                  description: 'ID батла'
                  type: string
                  example: 5
                paid:
                  description: 'Платное true \ false'
                  type: integer
                  example: 1
                is_ad:
                  description: 'Это реклама true \ false'
                  type: integer
                  example: 1
                get_erid:
                  description: 'Получить ЕРИД автоматически true \ false'
                  type: integer
                  example: 1
                ads_data:
                  description: 'Данные рекламы'
                  type: object
                  properties:
                    advertiser:
                      type: string
                      example: 'ООО Рекламодатель'
                    erid:
                      type: string
                      example: 'ERID123456789'
                    additional_link:
                      type: string
                      example: 'https://example.com'
      responses:
        200:
          description: ''
          content:
            application/json:
              examples:
                campaign_story:
                  summary: Сторис копилки создана
                  value:
                    success: true
                    story_id: 1
                regular_story:
                  summary: Обычная сторис создана
                  value:
                    success: true
                    story_id: 2
        400:
          description: ''
          content:
            application/json:
              examples:
                empty:
                  summary: Файл или media_id не переданы
                  value:
                    success: false
                    error: Отсутствует контент
                unsupported_image_format:
                  summary: Неподдерживаемый формат изображения
                  value:
                    success: false
                    error: Этот формат не поддерживается. Пожалуйста, загрузите фото в формате JPEG, JPG, PNG, HEIF или HEIC
                file_too_large:
                  summary: Превышен максимальный вес изображения
                  value:
                    success: false
                    error: Вес файла превышает 10 Мб.
                video_too_long:
                  summary: Видео длиннее 60 секунд
                  value:
                    success: false
                    error: Длительность видео превышает 60 сек. Пожалуйста, загрузите более короткое видео для сторис
                campaign_unavailable:
                  summary: Копилка не найдена или недоступна пользователю
                  value:
                    success: false
                    error: Копилка не найдена или недоступна

