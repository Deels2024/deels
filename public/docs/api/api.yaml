  /api/challenges/store:
    post:
      tags:
        - Challenges
      summary: 'Создание челленджа'
      description: |-
        Создает челлендж. Запрос должен отправляться как multipart/form-data.
        Обложка mainImg обязательна. Вводное сторис intro_story необязательно.
        Если intro_story передан, он создается как main_story.
        Если intro_story является видео, видео обрезается до 5 секунд и для него генерируется video_preview.
        Челлендж-коин временно отключен: amount необязателен и сохраняется как 0.
        Для редактирования передайте challenge_id. Неизмененные файлы повторно обрабатывать не требуется.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - min_participants
                - days
                - criteria[]
                - mainImg
              properties:
                title:
                  description: 'Название челленджа'
                  type: string
                  example: Название
                description:
                  description: 'Описание челленджа'
                  type: string
                  example: Описание
                amount:
                  description: 'Челлендж-коин временно отключен. Значение необязательно и сохраняется как 0.'
                  type: integer
                  minimum: 0
                  maximum: 10000
                  example: 0
                min_participants:
                  description: 'Минимальное количество участников для старта челленджа. Заполняется из participants_visual: 0 — не указывать, 1 — один участник, limit — значение min_participants_limit.'
                  type: integer
                  minimum: 0
                  maximum: 100
                  example: 0
                cost:
                  description: 'Стоимость участия в челлендже'
                  type: integer
                  example: 0
                days:
                  description: 'Продолжительность челленджа в днях'
                  type: integer
                  minimum: 1
                  example: 1
                criteria[]:
                  description: 'Критерии победителя. Минимум один элемент: by_views, by_comments, by_likes.'
                  type: string
                  example: by_likes
                mainImg:
                  description: 'Обязательная обложка челленджа: изображение или видео до 5 секунд.'
                  type: string
                  format: binary
                intro_story:
                  description: 'Необязательное вводное сторис: изображение или видео. Если передано, используется как main_story и как fallback для обложки/preview.'
                  type: string
                  format: binary
                date_from_visual:
                  description: 'Дата и время начала в формате ДД.ММ.ГГ ЧЧ:ММ. Необязательно, по умолчанию текущее время.'
                  type: string
                  example: '12.07.26 15:30'
                date_to_visual:
                  description: 'Дата и время окончания в формате ДД.ММ.ГГ ЧЧ:ММ. Необязательно.'
                  type: string
                  example: '19.07.26 15:30'
                participants_visual:
                  description: 'Число участников: 0 — не указывать, 1 — один участник, 2 — два участника, limit — значение из min_participants_limit.'
                  type: string
                  enum: ['0', '1', '2', limit]
                  example: '0'
                min_participants_limit:
                  description: 'Лимит участников от 2 до 100. Обязателен, если participants_visual=limit.'
                  type: integer
                  minimum: 2
                  maximum: 100
                  example: 10
                visibility:
                  description: 'Видимость челленджа.'
                  type: string
                  example: all
                rhythm_visual:
                  description: 'Ритм челленджа.'
                  type: string
                  example: daily
                checkin_visual:
                  description: 'Тип чек-ина. Для выбора победителя по лайкам нужен story.'
                  type: string
                  example: story
                reward_amount:
                  description: 'Награда в дилсах. Необязательно, только положительное значение, не больше баланса автора.'
                  type: integer
                  minimum: 1
                  example: 500
                winner_selection:
                  description: 'Выбор победителя: likes — по лайкам, creator — решение создателя. Если checkin_visual не story, likes автоматически заменяется на creator.'
                  type: string
                  enum: [likes, creator]
                  example: likes
                invite_user_ids[]:
                  description: 'ID приглашенных пользователей.'
                  type: integer
                  example: 123
                challenge_id:
                  description: 'ID редактируемого челленджа. Если отсутствует, создается новый челлендж.'
                  type: integer
                  example: 5

      responses:
        200:
          description: ''
          content:
            application/json:
              example:
                success: true
                challenge_id: 5
                clear_challenge_create_draft: true
        400:
          description: ''
          content:
            application/json:
              example:
                success: false
                errors:
                  mainImg:
                    - Добавьте обложку
                  criteria:
                    - Поле Критерии должно быть массивом.
                    - Количество элементов в поле Критерии должно быть не менее 1.
                    - Выберите критерий победителя
                  date_to:
                    - В поле Дата окончания должна быть дата после 13.05.2024.

