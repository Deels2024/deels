name: New design smoke checks

on:
  push:
    branches:
      - codex/new-design-migration
    paths:
      - app/Services/Contests/ContestListService.php
      - resources/views/**
      - public/dist/css/deelsweb-*.css
      - public/dist/js/deels-v2.js
      - public/dist/js/deels-functional-v2.js
      - public/dist/js/deels-admin-v2.js
      - .github/workflows/new-design-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite

      - name: Composer manifest
        run: composer validate --no-check-publish

      - name: PHP syntax
        run: php -l app/Services/Contests/ContestListService.php

      - name: Verify final design assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            public/dist/css/deels-v2.css \
            public/dist/css/deels-v2-compat.css \
            public/dist/css/deelsweb-home-source.css \
            public/dist/css/deelsweb-header-source.css \
            public/dist/css/deelsweb-catalog-source.css \
            public/dist/css/deelsweb-detail-source.css \
            public/dist/css/deelsweb-feed-source.css \
            public/dist/css/deelsweb-campaign-detail-source.css \
            public/dist/css/deelsweb-dashboard-source.css \
            public/dist/css/deelsweb-create-source.css \
            public/dist/css/deelsweb-auth-source.css \
            public/dist/css/deelsweb-auth-functions-source.css \
            public/dist/css/deelsweb-functional-source.css \
            public/dist/css/deelsweb-contest-actions-source.css \
            public/dist/css/deelsweb-wallet-tools-source.css \
            public/dist/css/deelsweb-profile-functions-source.css \
            public/dist/css/deelsweb-messages-functions-source.css \
            public/dist/css/deelsweb-admin-source.css \
            public/dist/js/deels-v2.js \
            public/dist/js/deels-functional-v2.js \
            public/dist/js/deels-admin-v2.js; do
            test -s "$file" || { echo "Missing or empty asset: $file"; exit 1; }
          done

      - name: Verify critical Blade surfaces
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            resources/views/home.blade.php \
            resources/views/challenges_index.blade.php \
            resources/views/challenges/page_front.blade.php \
            resources/views/challenges/partials/create_form.blade.php \
            resources/views/stories_index.blade.php \
            resources/views/stories/story_item.blade.php \
            resources/views/campaign_single_new.blade.php \
            resources/views/admin/profile_edit.blade.php \
            resources/views/dashboard/wallet/wallet_index.blade.php \
            resources/views/auth/login.blade.php \
            resources/views/auth/register.blade.php \
            resources/views/layouts/admin/parts/admin_menu.blade.php; do
            test -s "$file" || { echo "Missing Blade surface: $file"; exit 1; }
          done

      - name: Verify route contracts used by new UI
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            "name('home')" \
            "'as' => 'challenges.catalog'" \
            "'as' => 'challenge_page'" \
            "'as' => 'battle_page'" \
            "name('contests.invites.users')" \
            "name('contests.invites.store')" \
            "name('contests.participation.leave')" \
            "name('contests.participation.rejoin')" \
            "name('contests.participation.join')" \
            "name('battles.participation.accept')" \
            "name('battles.participation.decline')" \
            "name('contests.reports.store')" \
            "name('campaign_single')" \
            "name('campaign_backers')" \
            "name('campaign_updates')" \
            "name('campaign_faqs')" \
            "'as' => 'stories.catalog'" \
            "'as' => 'stories.create'" \
            "'as' => 'user_challenges'" \
            "'as' => 'user_stories'" \
            "'as' => 'my_campaigns'" \
            "'as' => 'edit_campaign_rewards'" \
            "'as' => 'edit_campaign_updates'" \
            "'as' => 'edit_campaign_faqs'" \
            "'as' => 'user_wallet'" \
            "'as' => 'messages'" \
            "'as' => 'user_likes'" \
            "'as' => 'user_followers'" \
            "'as' => 'user_friends'" \
            "'as' => 'user_followings'" \
            "name('autopayments')" \
            "name('thank_list')"; do
            grep -q "$pattern" routes/web.php || { echo "Missing route contract: $pattern"; exit 1; }
          done

      - name: Verify restored functional links
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            /dashboard/challenges \
            /dashboard/stories \
            /dashboard/my_campaigns \
            /dashboard/wallet \
            /dashboard/messages \
            /dashboard/user_likes \
            /dashboard/user_friends \
            /dashboard/user_followings \
            /dashboard/user_followers \
            /dashboard/autopayments \
            /dashboard/thanks \
            /campaign/backers/ \
            /campaign/updates/ \
            /campaign/faqs/ \
            /rewards \
            /updates \
            /faqs; do
            grep -q "$path" public/dist/js/deels-v2.js || { echo "Missing restored UI link: $path"; exit 1; }
          done
          grep -q '/dashboard/wallet?type=billing' public/dist/js/deels-functional-v2.js
          grep -q '/dashboard/wallet?type=donate' public/dist/js/deels-functional-v2.js
          grep -q '/dashboard/autopayments' public/dist/js/deels-functional-v2.js

      - name: Verify contest actions remain visible
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'challenge-participation-actions' public/dist/css/deelsweb-contest-actions-source.css
          grep -q 'contest-page-invite' public/dist/css/deelsweb-contest-actions-source.css
          grep -q 'contest-reporting' public/dist/css/deelsweb-contest-actions-source.css
          grep -q 'contest-winner-selection-action' public/dist/css/deelsweb-contest-actions-source.css
          grep -q 'contest-journal' public/dist/css/deelsweb-contest-actions-source.css
          grep -q 'battle-reports' public/dist/css/deelsweb-contest-actions-source.css

      - name: Verify profile and messaging functions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'profile-reflink' public/dist/css/deelsweb-profile-functions-source.css
          grep -q 'profile-dignity' public/dist/css/deelsweb-profile-functions-source.css
          grep -q 'profile-donate' public/dist/css/deelsweb-profile-functions-source.css
          grep -q 'profile-statistics' public/dist/css/deelsweb-profile-functions-source.css
          grep -q 'header-chat__btn--notifications' public/dist/css/deelsweb-messages-functions-source.css
          grep -q 'abuse_modal' public/dist/css/deelsweb-messages-functions-source.css
          grep -q 'chat-form' public/dist/css/deelsweb-messages-functions-source.css

      - name: Verify auth security functions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'registration_fill_time_ms' resources/views/auth/register.blade.php
          grep -q 'registration_keypress_count' resources/views/auth/register.blade.php
          grep -q 'registration_paste_insert_count' resources/views/auth/register.blade.php
          grep -q 'registration_browser_autofill' resources/views/auth/register.blade.php
          grep -q 'name="contact_url"' resources/views/auth/register.blade.php
          grep -q 'emailCodeField' resources/views/auth/register.blade.php
          grep -q 'name="phone"' resources/views/auth/register.blade.php
          grep -q "route('password.request')" resources/views/auth/register.blade.php
          grep -q "auth.socials_light" resources/views/auth/register.blade.php
          grep -q 'enable_recaptcha_registration' resources/views/auth/register.blade.php
          grep -q 'agree_1' resources/views/auth/register.blade.php
          grep -q 'agree_2' resources/views/auth/register.blade.php
          grep -q 'agree_3' resources/views/auth/register.blade.php
          grep -q 'agree_4' resources/views/auth/register.blade.php

      - name: Verify permission-driven admin center
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'document.querySelector(.admin_menu' public/dist/js/deels-admin-v2.js || grep -q "document.querySelector('.admin_menu')" public/dist/js/deels-admin-v2.js
          grep -q 'collectAdminLinks' public/dist/js/deels-admin-v2.js
          grep -q 'deels-admin-hub' public/dist/css/deelsweb-admin-source.css

      - name: Verify no duplicate scripted homepage hero
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "deels-v2-home-hero" public/dist/js/deels-v2.js; then
            echo "Legacy scripted homepage hero is still present"
            exit 1
          fi

      - name: Verify source-faithful home markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Твоя идея" resources/views/home.blade.php
          grep -q "может стать" resources/views/home.blade.php
          grep -q "source-phone-frame" resources/views/home.blade.php
          grep -q "source-campaign-grid" resources/views/home.blade.php

      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare isolated Laravel environment
        shell: bash
        run: |
          set -euo pipefail
          : > .env
          {
            echo 'APP_NAME=Deels'
            echo 'APP_ENV=testing'
            echo 'APP_DEBUG=true'
            echo 'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
            echo 'APP_URL=http://127.0.0.1'
            echo 'DB_CONNECTION=sqlite'
            echo 'DB_DATABASE=:memory:'
            echo 'CACHE_DRIVER=array'
            echo 'SESSION_DRIVER=array'
            echo 'QUEUE_CONNECTION=sync'
            echo 'MAIL_MAILER=array'
            echo 'DISABLE_JIVOSITE=true'
          } >> .env
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Laravel route bootstrap
        shell: bash
        run: |
          set -o pipefail
          php artisan route:list 2>&1 | tee /tmp/routes.txt

      - name: Verify runtime routes
        shell: bash
        run: |
          set -euo pipefail
          for route in \
            home challenges.catalog challenge_page battle_page \
            contests.invites.users contests.invites.store contests.participation.leave contests.participation.rejoin contests.participation.join \
            battles.participation.accept battles.participation.decline contests.reports.store \
            campaign_single campaign_backers campaign_updates campaign_faqs \
            stories.catalog stories.create user_challenges user_stories my_campaigns edit_campaign_rewards edit_campaign_updates edit_campaign_faqs \
            user_wallet messages user_likes user_followers user_friends user_followings autopayments thank_list; do
            grep -q "$route" /tmp/routes.txt || { echo "Missing runtime route: $route"; exit 1; }
          done