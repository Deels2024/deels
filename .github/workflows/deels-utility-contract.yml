name: Deels utility API contract

on:
  push:
    branches:
      - codex/new-design-migration
    paths:
      - 'app/Http/Controllers/Api/DeelsUtilityCompatibilityController.php'
      - 'routes/deels_compat.php'
      - '.github/workflows/deels-utility-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite

      - name: PHP syntax
        run: |
          php -l app/Http/Controllers/Api/DeelsUtilityCompatibilityController.php
          php -l routes/deels_compat.php

      - name: Verify source contracts
        run: |
          src=$(mktemp)
          curl -fsSL https://raw.githubusercontent.com/Deels2024/deelsweb/main/app/lib/api/endpoints.ts > "$src"
          grep -q 'forgotPassword: api("auth/forgot-password")' "$src"
          grep -q 'resetPassword: api("auth/reset-password")' "$src"
          grep -q 'me: api("user")' "$src"
          grep -q 'search: (query: string) => api(`search?q=${encode(query)}`)' "$src"
          grep -q 'uploads: api("media")' "$src"
          grep -q 'contacts: api("contacts")' "$src"

      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare Laravel
        run: |
          : > .env
          {
            echo 'APP_NAME=Deels'
            echo 'APP_ENV=testing'
            echo 'APP_DEBUG=true'
            echo 'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
            echo 'APP_URL=http://127.0.0.1'
            echo 'DB_CONNECTION=sqlite'
            echo 'DB_DATABASE=:memory:'
            echo 'CACHE_DRIVER=array'
            echo 'SESSION_DRIVER=array'
            echo 'QUEUE_CONNECTION=sync'
            echo 'MAIL_MAILER=array'
            echo 'DISABLE_JIVOSITE=true'
          } >> .env
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Verify utility routes
        run: |
          php artisan route:list --path=api --json > /tmp/routes.json
          jq -e '.[] | select(.name=="deels.compat.auth.forgot-password" and .uri=="api/auth/forgot-password" and .method=="POST")' /tmp/routes.json >/dev/null
          jq -e '.[] | select(.name=="deels.compat.auth.reset-password" and .uri=="api/auth/reset-password" and .method=="POST")' /tmp/routes.json >/dev/null
          jq -e '.[] | select(.name=="deels.compat.auth.me" and .uri=="api/user" and (.method|contains("GET")))' /tmp/routes.json >/dev/null
          jq -e '.[] | select(.name=="deels.compat.search" and .uri=="api/search" and (.method|contains("GET")))' /tmp/routes.json >/dev/null
          jq -e '.[] | select(.name=="deels.compat.media.store" and .uri=="api/media" and .method=="POST")' /tmp/routes.json >/dev/null
          jq -e '.[] | select(.name=="deels.compat.contacts.store" and .uri=="api/contacts" and .method=="POST")' /tmp/routes.json >/dev/null

      - name: Verify runtime matchers
        run: |
          php artisan tinker --execute='echo app("router")->getRoutes()->match(\Illuminate\Http\Request::create("/api/user", "GET"))->getName();' | tee /tmp/user-match.txt
          grep -Fq 'deels.compat.auth.me' /tmp/user-match.txt
          php artisan tinker --execute='echo app("router")->getRoutes()->match(\Illuminate\Http\Request::create("/api/search?q=test", "GET"))->getName();' | tee /tmp/search-match.txt
          grep -Fq 'deels.compat.search' /tmp/search-match.txt
