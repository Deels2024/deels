name: Deels GitHub Pages

on:
  push:
    branches:
      - codex/new-design-migration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deels-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Deels branch
        uses: actions/checkout@v4
        with:
          path: laravel

      - name: Checkout Deelsweb source styles
        uses: actions/checkout@v4
        with:
          repository: Deels2024/deelsweb
          ref: main
          path: deelsweb

      - name: Build static GitHub Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/source/home-media

          cp laravel/public/design-preview.html _site/index.html
          cp laravel/public/design-preview-home-enhancements.js _site/source/design-preview-home-enhancements.js
          cp laravel/public/design-preview-polish.js _site/source/design-preview-polish.js
          cp laravel/public/design-preview-feed-ux.js _site/source/design-preview-feed-ux.js
          cp laravel/public/design-preview-feed-compact.js _site/source/design-preview-feed-compact.js
          cp laravel/public/design-preview-challenges.js _site/source/design-preview-challenges.js
          cp laravel/public/design-preview-media-fill.js _site/source/design-preview-media-fill.js
          cp laravel/public/home-media/*.webp _site/source/home-media/

          cp deelsweb/app/themes/deels-main.css _site/source/deels-main.css
          cp deelsweb/app/styles.css _site/source/styles.css
          cp deelsweb/app/pages.css _site/source/pages.css
          cp laravel/public/dist/css/deelsweb-final-polish.css _site/source/deelsweb-final-polish.css
          cp laravel/public/dist/css/deelsweb-qa-source.css _site/source/deelsweb-qa-source.css

          sed -i 's#</body>#<script src="./source/design-preview-home-enhancements.js"></script>\n<script src="./source/design-preview-polish.js"></script>\n<script src="./source/design-preview-feed-ux.js"></script>\n<script src="./source/design-preview-feed-compact.js"></script>\n<script src="./source/design-preview-challenges.js"></script>\n<script src="./source/design-preview-media-fill.js"></script>\n</body>#' _site/index.html

          printf '{"sha":"%s","branch":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > _site/build-info.json
          touch _site/.nojekyll

      - name: Verify static site
        run: |
          set -euo pipefail

          for id in home feed challenges battles profile wallet messages create campaign admin; do
            grep -q "id=\"screen-$id\"" _site/index.html
          done

          for script in \
            design-preview-home-enhancements.js \
            design-preview-polish.js \
            design-preview-feed-ux.js \
            design-preview-feed-compact.js \
            design-preview-challenges.js \
            design-preview-media-fill.js; do
            test -s "_site/source/$script"
            grep -q "$script" _site/index.html
          done

          for style in deels-main.css styles.css pages.css deelsweb-final-polish.css deelsweb-qa-source.css; do
            test -s "_site/source/$style"
          done
          grep -q "deelsweb-final-polish.css" _site/source/deelsweb-qa-source.css

          for asset in \
            hero-rooftop.webp \
            video-creator.webp \
            video-boy.webp \
            video-friends.webp \
            video-dance.webp \
            story-dance-v2.webp \
            story-stage-v2.webp; do
            test -s "_site/source/home-media/$asset"
          done

          test -s _site/build-info.json

          if grep -q 'design-preview-home-live.js' _site/index.html; then exit 1; fi
          if grep -q 'design-preview-home-live-fix.js' _site/index.html; then exit 1; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: success()
        run: |
          echo "Deels GitHub Pages deployed"
          echo "Commit: $GITHUB_SHA"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
