name: Deels design preview

on:
  push:
    branches:
      - codex/new-design-migration
    paths:
      - public/design-preview.html
      - .github/workflows/design-preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deels-design-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Laravel preview branch
        uses: actions/checkout@v4
        with:
          path: laravel

      - name: Checkout original Deelsweb design
        uses: actions/checkout@v4
        with:
          repository: Deels2024/deelsweb
          ref: main
          path: deelsweb

      - name: Prepare source-faithful preview
        run: |
          mkdir -p _preview/source
          cp laravel/public/design-preview.html _preview/index.html
          cp deelsweb/app/themes/deels-main.css _preview/source/deels-main.css
          cp deelsweb/app/styles.css _preview/source/styles.css
          cp deelsweb/app/pages.css _preview/source/pages.css
          touch _preview/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _preview

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview ready
        if: success()
        run: echo "Source-faithful Deelsweb preview deployed"
