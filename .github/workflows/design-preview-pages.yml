name: Deels design preview

on:
  push:
    branches:
      - codex/new-design-migration
    paths:
      - 'public/design-preview.html'
      - 'public/design-preview-home-enhancements.js'
      - 'public/dist/css/deelsweb-*.css'
      - 'public/dist/css/deels-v2*.css'
      - 'public/dist/js/deels-*.js'
      - 'resources/views/**'
      - '.github/workflows/design-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deels-design-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Laravel preview branch
        uses: actions/checkout@v4
        with:
          path: laravel

      - name: Checkout original Deelsweb design
        uses: actions/checkout@v4
        with:
          repository: Deels2024/deelsweb
          ref: main
          path: deelsweb

      - name: Prepare interactive source-faithful preview
        run: |
          set -euo pipefail
          mkdir -p _preview/source
          cp laravel/public/design-preview.html _preview/index.html
          cp laravel/public/design-preview-home-enhancements.js _preview/source/design-preview-home-enhancements.js
          cp deelsweb/app/themes/deels-main.css _preview/source/deels-main.css
          cp deelsweb/app/styles.css _preview/source/styles.css
          cp deelsweb/app/pages.css _preview/source/pages.css
          cp laravel/public/dist/css/deelsweb-home-source.css _preview/source/deelsweb-home-source.css
          cp laravel/public/dist/css/deelsweb-home-enhancements.css _preview/source/deelsweb-home-enhancements.css
          cp laravel/public/dist/css/deelsweb-qa-source.css _preview/source/deelsweb-qa-source.css
          sed -i 's#</head>#<link rel="stylesheet" href="./source/deelsweb-home-source.css">\n<link rel="stylesheet" href="./source/deelsweb-home-enhancements.css">\n</head>#' _preview/index.html
          sed -i 's#</body>#<script src="./source/design-preview-home-enhancements.js"></script>\n</body>#' _preview/index.html
          touch _preview/.nojekyll

      - name: Verify preview screens
        run: |
          set -euo pipefail
          for id in home feed challenges battles profile wallet messages create campaign admin; do
            grep -q "id=\"screen-$id\"" _preview/index.html
          done
          grep -q 'deelsweb-qa-source.css' _preview/index.html
          grep -q 'deelsweb-home-source.css' _preview/index.html
          grep -q 'deelsweb-home-enhancements.css' _preview/index.html
          grep -q 'design-preview-home-enhancements.js' _preview/index.html
          grep -q 'INTERACTIVE PREVIEW' _preview/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _preview

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview ready
        if: success()
        run: |
          echo "Interactive Deels preview deployed"
          echo "${{ steps.deployment.outputs.page_url }}"