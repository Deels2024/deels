name: New design auth and admin smoke

on:
  push:
    branches:
      - codex/new-design-migration
    paths:
      - resources/views/auth/**
      - resources/views/admin/**
      - resources/views/layouts/neon/header*.blade.php
      - public/dist/css/deelsweb-auth-functions-source.css
      - public/dist/css/deelsweb-admin-lists-source.css
      - public/dist/js/deels-auth-functions-v2.js
      - .github/workflows/new-design-auth-admin-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify auth assets and state hooks
        shell: bash
        run: |
          set -euo pipefail
          test -s public/dist/js/deels-auth-functions-v2.js
          test -s public/dist/css/deelsweb-auth-functions-source.css
          grep -q 'deels-auth-functions-v2.js' resources/views/layouts/neon/header_light.blade.php
          grep -q 'sendCodeBtn' public/dist/js/deels-auth-functions-v2.js
          grep -q 'aria-invalid' public/dist/js/deels-auth-functions-v2.js
          grep -q 'is-loading' public/dist/css/deelsweb-auth-functions-source.css
          grep -q 'is-success' public/dist/css/deelsweb-auth-functions-source.css
          grep -q 'is-error' public/dist/css/deelsweb-auth-functions-source.css
          grep -q 'retry_after' resources/views/auth/register.blade.php
          grep -q 'user/sendEmailCode' resources/views/auth/register.blade.php
          grep -q 'user/checkEmailCode' resources/views/auth/register.blade.php

      - name: Verify moderation list layer
        shell: bash
        run: |
          set -euo pipefail
          test -s public/dist/css/deelsweb-admin-lists-source.css
          grep -q 'deelsweb-admin-lists-source.css' resources/views/layouts/neon/header.blade.php
          grep -q 'admin-main' public/dist/css/deelsweb-admin-lists-source.css
          grep -q 'admin_challenges.confirm' resources/views/admin/challenges.blade.php
          grep -q 'type=declined' resources/views/admin/challenges.blade.php
          grep -q 'type=active' resources/views/admin/challenges.blade.php
          grep -q 'type=blocked' resources/views/admin/challenges.blade.php

      - name: Verify legacy actions still present
        shell: bash
        run: |
          set -euo pipefail
          grep -q "data-action') === 'trash'" resources/views/admin/challenges.blade.php
          grep -q "data-action') === 'restart'" resources/views/admin/challenges.blade.php
          grep -q "action == 'approve'" resources/views/admin/challenges.blade.php
          grep -q 'challenges.remove' resources/views/admin/challenges.blade.php
