name: Deels compatibility API contract

on:
  push:
    branches:
      - codex/new-design-migration
    paths:
      - 'app/Http/Controllers/Api/DeelsCompatibilityController.php'
      - 'app/Http/Controllers/Api/DeelsContentCompatibilityController.php'
      - 'app/Http/Controllers/Api/DeelsCampaignCompatibilityController.php'
      - 'app/Http/Controllers/Api/DeelsSocialCompatibilityController.php'
      - 'app/Http/Requests/DeelsCampaignStoreRequest.php'
      - 'app/Providers/RouteServiceProvider.php'
      - 'routes/deels_compat.php'
      - '.github/workflows/deels-compat-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Laravel
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite

      - name: PHP syntax
        run: |
          php -l app/Http/Controllers/Api/DeelsCompatibilityController.php
          php -l app/Http/Controllers/Api/DeelsContentCompatibilityController.php
          php -l app/Http/Controllers/Api/DeelsCampaignCompatibilityController.php
          php -l app/Http/Controllers/Api/DeelsSocialCompatibilityController.php
          php -l app/Http/Requests/DeelsCampaignStoreRequest.php
          php -l app/Providers/RouteServiceProvider.php
          php -l routes/deels_compat.php

      - name: Verify source contracts
        run: |
          src=$(mktemp)
          curl -fsSL https://raw.githubusercontent.com/Deels2024/deelsweb/main/app/lib/api/endpoints.ts > "$src"
          grep -q 'login: api("auth/login")' "$src"
          grep -q 'register: api("auth/register")' "$src"
          grep -q 'logout: api("auth/logout")' "$src"
          grep -q 'api("stats")' "$src"
          grep -q 'api("feed")' "$src"
          grep -q 'list: api("challenges")' "$src"
          grep -q 'create: api("challenges")' "$src"
          grep -q 'api(`challenges/${encode(id)}`)' "$src"
          grep -q 'api(`challenges/${encode(id)}/responses`)' "$src"
          grep -q 'list: api("stories")' "$src"
          grep -q 'create: api("stories")' "$src"
          grep -q 'api(`stories/${encode(id)}`)' "$src"
          grep -q 'list: api("campaigns")' "$src"
          grep -q 'create: api("campaigns")' "$src"
          grep -q 'api(`campaigns/${encode(id)}`)' "$src"
          grep -q 'me: api("profile")' "$src"
          grep -q 'uploadAvatar: api("profile/avatar")' "$src"
          grep -q 'api(`users/${encode(id)}`)' "$src"
          grep -q 'api(`users/${encode(id)}/content`)' "$src"
          grep -q 'api(`users/${encode(id)}/follow`)' "$src"
          grep -q 'api(`${encode(type)}/${encode(id)}/like`)' "$src"
          grep -q 'api(`${encode(type)}/${encode(id)}/comments`)' "$src"
          grep -q 'api(`${encode(type)}/${encode(id)}/share`)' "$src"
          grep -q 'api("wallet")' "$src"
          grep -q 'api("messages/dialogs")' "$src"

      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare isolated Laravel environment
        run: |
          : > .env
          {
            echo 'APP_NAME=Deels'
            echo 'APP_ENV=testing'
            echo 'APP_DEBUG=true'
            echo 'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
            echo 'APP_URL=http://127.0.0.1'
            echo 'DB_CONNECTION=sqlite'
            echo 'DB_DATABASE=:memory:'
            echo 'CACHE_DRIVER=array'
            echo 'SESSION_DRIVER=array'
            echo 'QUEUE_CONNECTION=sync'
            echo 'MAIL_MAILER=array'
            echo 'DISABLE_JIVOSITE=true'
          } >> .env
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Laravel route bootstrap
        run: |
          php artisan route:list --path=api | tee /tmp/api-routes.txt
          php artisan route:list --path=api --json > /tmp/api-routes.json

      - name: Verify compatibility routes
        run: |
          set -euo pipefail
          for route in \
            'api/auth/login' \
            'api/auth/register' \
            'api/auth/logout' \
            'api/stats' \
            'api/feed' \
            'api/stories' \
            'api/stories/{id}' \
            'api/challenges/{id}' \
            'api/challenges/{id}/responses' \
            'api/campaigns' \
            'api/campaigns/{id}' \
            'api/profile' \
            'api/profile/avatar' \
            'api/users/{id}' \
            'api/users/{id}/content' \
            'api/users/{id}/follow' \
            'api/{type}/{id}/like' \
            'api/{type}/{id}/comments' \
            'api/{type}/{id}/share' \
            'api/wallet' \
            'api/messages/dialogs' \
            'api/messages/dialogs/{id}'; do
            grep -Fq "$route" /tmp/api-routes.txt || { echo "Missing compatibility route: $route"; exit 1; }
          done

      - name: Verify write methods
        run: |
          set -euo pipefail
          grep -E 'POST +api/challenges ' /tmp/api-routes.txt
          grep -E 'PUT +api/challenges/\{id\} ' /tmp/api-routes.txt
          grep -E 'POST +api/challenges/\{id\}/responses ' /tmp/api-routes.txt
          grep -E 'POST +api/stories ' /tmp/api-routes.txt
          grep -E 'POST +api/campaigns ' /tmp/api-routes.txt
          grep -E 'PATCH +api/profile ' /tmp/api-routes.txt
          grep -E 'POST +api/profile/avatar ' /tmp/api-routes.txt
          grep -E 'POST +api/users/\{id\}/follow ' /tmp/api-routes.txt
          grep -E 'POST +api/\{type\}/\{id\}/like ' /tmp/api-routes.txt
          grep -E 'DELETE +api/\{type\}/\{id\}/like ' /tmp/api-routes.txt
          grep -E 'POST +api/\{type\}/\{id\}/comments ' /tmp/api-routes.txt
          grep -E 'POST +api/\{type\}/\{id\}/share ' /tmp/api-routes.txt

      - name: Verify compatibility route names
        run: |
          set -euo pipefail
          for name in \
            deels.compat.auth.login \
            deels.compat.auth.register \
            deels.compat.auth.logout \
            deels.compat.stats \
            deels.compat.feed \
            deels.compat.stories.index \
            deels.compat.stories.show \
            deels.compat.stories.store \
            deels.compat.challenges.show \
            deels.compat.challenges.store \
            deels.compat.challenges.update \
            deels.compat.challenges.responses.store \
            deels.compat.campaigns.index \
            deels.compat.campaigns.show \
            deels.compat.campaigns.store \
            deels.compat.profile.show \
            deels.compat.profile.update \
            deels.compat.profile.avatar \
            deels.compat.users.show \
            deels.compat.users.content \
            deels.compat.users.follow \
            deels.compat.social.like \
            deels.compat.social.unlike \
            deels.compat.social.comment \
            deels.compat.social.share \
            deels.compat.wallet \
            deels.compat.messages.dialogs \
            deels.compat.messages.thread; do
            grep -Fq '"name":"'"$name"'"' /tmp/api-routes.json || { echo "Missing compatibility route name: $name"; exit 1; }
          done

      - name: Verify runtime matchers
        run: |
          set -euo pipefail
          php artisan tinker --execute='echo app("router")->getRoutes()->match(\Illuminate\Http\Request::create("/api/campaigns", "GET"))->getName();' | tee /tmp/campaign-match.txt
          grep -Fq 'deels.compat.campaigns.index' /tmp/campaign-match.txt
          php artisan tinker --execute='echo app("router")->getRoutes()->match(\Illuminate\Http\Request::create("/api/profile", "GET"))->getName();' | tee /tmp/profile-match.txt
          grep -Fq 'deels.compat.profile.show' /tmp/profile-match.txt
