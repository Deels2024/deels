services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.staging
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: deels_staging
      DB_USERNAME: deels
      DB_PASSWORD: deels_staging
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@file_get_contents(\"http://127.0.0.1:8080/\"); exit($$c===false?1:0);'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: deels_staging
      MYSQL_USER: deels
      MYSQL_PASSWORD: deels_staging
      MYSQL_ROOT_PASSWORD: root_staging_only
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - deels_staging_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_staging_only"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  deels_staging_mysql:
